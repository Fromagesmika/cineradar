<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CinéRadar</title>
<meta name="description" content="Your film-loving friend who finds the hidden gems">
<meta name="theme-color" content="#0e0e15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CinéRadar">
<meta name="robots" content="noindex">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
  /* This page is only the front door: the app itself runs on a Hugging Face Space and checks the code there */
  :root {color-scheme: dark}
  * {box-sizing: border-box}
  html, body {margin: 0; height: 100%; background: #0e0e15; color: #ececf1;
              font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
  body {background: radial-gradient(900px 480px at 75% -10%, rgba(124, 58, 237, .25), transparent 62%),
                    radial-gradient(700px 420px at -10% 110%, rgba(236, 72, 153, .10), transparent 60%), #0e0e15}
  main {min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px}
  .card {width: 100%; max-width: 380px}
  h1 {margin: 0; font-size: 2.6rem; line-height: 1.1; font-weight: 800;
      background: linear-gradient(90deg, #ddd6fe, #a78bfa 45%, #f0abfc); -webkit-background-clip: text;
      background-clip: text; color: transparent}
  p {opacity: .75; margin: .4rem 0 1.6rem}
  label {display: block; font-size: .85rem; margin: 1rem 0 .35rem; opacity: .85}
  input {width: 100%; padding: .8rem .9rem; border-radius: 10px; border: 1px solid rgba(139, 92, 246, .3);
         background: #1a1a26; color: inherit; font-size: 1rem; outline: none}
  input:focus {border-color: #8b5cf6}
  small {display: block; opacity: .55; margin-top: .3rem; font-size: .75rem}
  button {width: 100%; margin-top: 1.4rem; padding: .85rem; border: 0; border-radius: 10px; font-size: 1rem;
          font-weight: 600; color: #fff; background: linear-gradient(90deg, #7c3aed, #a855f7); cursor: pointer}
  #app {position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #0e0e15}
  #change {position: fixed; top: max(6px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
           z-index: 2; display: none; padding: 2px 10px; width: auto; margin: 0; font-size: .7rem; font-weight: 500;
           background: rgba(139, 92, 246, .25); border-radius: 999px; opacity: .55}
  #loading {position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
            flex-direction: column; gap: .5rem; text-align: center; padding: 24px; pointer-events: none}
  #loading small {max-width: 300px}
  .spin {width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(139, 92, 246, .25);
         border-top-color: #a78bfa; animation: spin 1s linear infinite}
  @keyframes spin {to {transform: rotate(360deg)}}
</style>
</head>
<body>
<main id="door">
  <form class="card" id="form" autocomplete="on">
    <h1>CinéRadar</h1>
    <p>Your film-loving friend who finds the hidden gems you would never find alone</p>
    <label for="code">Access code</label>
    <input id="code" name="password" type="password" autocomplete="current-password" required>
    <label for="user">Your user ID <span style="opacity:.6">(optional)</span></label>
    <input id="user" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 12">
    <small>With your ID, this page opens your profile directly next time. It is shown in the app's menu</small>
    <button type="submit">Open CinéRadar</button>
  </form>
</main>
<div id="loading"><div class="spin"></div><div>Opening CinéRadar…</div>
  <small>If the app slept for a while, waking it up takes up to a minute</small></div>
<iframe id="app" title="CinéRadar" allow="clipboard-write"></iframe>
<button id="change" type="button">change code or ID</button>
<script>
  // The address of the Hugging Face Space that runs the app (?space=... in the link overrides it)
  const SPACE = new URLSearchParams(location.search).get("space") || "https://SPACE-OWNER-cineradar.hf.space";
  const KEY = "cineradar";

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
  }
  function save(value) {
    try { localStorage.setItem(KEY, JSON.stringify(value)); } catch (e) { /* private mode: asked again next time */ }
  }
  function open(saved) {
    // The code goes to the Space, which checks it on its server and removes it from its address bar
    const url = new URL(SPACE);
    url.searchParams.set("code", saved.code);
    if (saved.user) url.searchParams.set("user", saved.user);
    const frame = document.getElementById("app");
    document.getElementById("door").style.display = "none";
    document.getElementById("loading").style.display = "flex";
    frame.onload = () => { document.getElementById("loading").style.display = "none"; };
    frame.src = url.toString();
    frame.style.display = "block";
    document.getElementById("change").style.display = "block";
  }

  const saved = load();
  if (location.hash === "#reset") { save({}); history.replaceState(null, "", location.pathname); }
  else if (saved.code) { open(saved); }
  document.getElementById("user").value = saved.user || "";

  document.getElementById("form").addEventListener("submit", (event) => {
    event.preventDefault();
    const value = {code: document.getElementById("code").value.trim(),
                   user: document.getElementById("user").value.replace(/\D/g, "")};
    save(value);
    open(value);
  });
  document.getElementById("change").addEventListener("click", () => {
    save({user: load().user || ""});  // forget the code, keep the ID filled in
    location.replace(location.pathname);
  });
</script>
</body>
</html>
